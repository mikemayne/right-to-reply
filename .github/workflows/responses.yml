name: Responses
on:
  pull_request:
  push:
    branches: [main]
    paths: [data/sources.json, data/disclaimer.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run deterministic unit tests
        run: node --test tests/feed.test.cjs
      - name: Validate live published response bundles
        if: ${{ !cancelled() }}
        run: node tools/validate.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python tools/package.py
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: RIGHT_TO_REPLY_STORE_ASSETS=store-assets node tests/browser.mjs
      - run: RIGHT_TO_REPLY_TEST_DISCLAIMER=1 node tests/browser.mjs
      - name: Upload Chrome Web Store listing assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-store-assets
          path: store-assets/
          if-no-files-found: error
