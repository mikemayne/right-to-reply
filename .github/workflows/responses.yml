name: Responses
on:
  pull_request:
  push:
    branches: [main]
    paths: [data/sources.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/import-sources.mjs
      - run: node --test tests/feed.test.cjs
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: approved-responses
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: node tools/import-sources.mjs
      - name: Publish approved response data
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/contents/data/sources.json?ref=main" --jq .sha)" != "$(git rev-parse HEAD:data/sources.json)" ]; then
            exit 0
          fi
          gh release create "responses-$GITHUB_SHA" data/responses.json --target "$GITHUB_SHA" --title "Approved responses" --notes "Reviewed response data for $GITHUB_SHA." --latest
