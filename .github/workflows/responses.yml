name: Responses
on:
  pull_request:
  push:
    branches: [main]
    paths: [data/sources.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node tools/validate.cjs
      - run: node --test tests/feed.test.cjs
