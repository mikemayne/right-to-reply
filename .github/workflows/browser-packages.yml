name: Browser packages
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'tools/package.py'
      - 'tools/website.mjs'
      - '.github/workflows/browser-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-packages-main
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build packages
        run: python3 tools/package.py
      - name: Validate browser ZIPs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          for browser in ("chrome", "edge", "firefox", "safari"):
              path = Path("dist") / f"right-to-reply-{browser}.zip"
              with ZipFile(path) as archive:
                  assert archive.testzip() is None, path
                  manifest = json.loads(archive.read("manifest.json"))
                  assert manifest["manifest_version"] == 3, path
                  for script in manifest["content_scripts"]:
                      for filename in script.get("js", []) + script.get("css", []):
                          assert filename in archive.namelist(), filename
                  for filename in manifest["icons"].values():
                      assert filename in archive.namelist(), filename
                  background = manifest["background"]
                  if browser in ("firefox", "safari"):
                      assert background == {"scripts": ["feed.js", "sources.js", "sync.js"]}, path
                  else:
                      assert background == {"service_worker": "sync.js"}, path
                  for filename in background.get("scripts", [background.get("service_worker")]):
                      assert filename in archive.namelist(), filename
                  assert manifest["action"]["default_popup"] in archive.namelist(), path
              print(f"Validated {path}")
          PY
          cd dist
          sha256sum right-to-reply-{chrome,edge,firefox,safari}.zip > SHA256SUMS.txt
      - name: Publish browser downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA}"
          assets=(dist/right-to-reply-{chrome,edge,firefox,safari}.zip dist/SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Packages for this source commit are already published."
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Browser build ${GITHUB_SHA:0:12}" \
              --notes "Automated unsigned browser packages built from commit $GITHUB_SHA. Extract the ZIP for your browser and follow the README's debug installation instructions. Safari iOS requires an Xcode wrapper and signing." \
              --latest
          fi
